name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild (e.g. v0.9.0-rc1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and publish to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image_tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          version="v$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("src/Directory.Build.props").findtext("PropertyGroup/Version"))')"
          if [[ "$GITHUB_REF_TYPE" == tag || -n "$RELEASE_TAG" ]]; then
            if [[ "$image_tag" != "$version" ]]; then
              echo "::error::Git tag $image_tag must match app version $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release tags must point to a commit on main"
              exit 1
            fi
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}:$image_tag"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --driver docker-container --use
          # Use the Dockerfile from the workflow ref when rebuilding older release sources.
          git show "$GITHUB_SHA:Dockerfile" | docker buildx build --file - \
            --platform linux/amd64,linux/arm64 --push --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$version" .
