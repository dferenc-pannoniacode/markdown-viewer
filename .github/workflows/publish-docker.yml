name: Publish Docker image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and publish to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="v$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("src/Directory.Build.props").findtext("PropertyGroup/Version"))')"
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Git tag $GITHUB_REF_NAME must match app version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on main"
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --driver docker-container --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 --push --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$version" .
